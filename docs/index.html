<!doctype html>
<html lang="ro" class="startup-transitions-blocked" data-beasties-container>
  <head>
    <title>Psaltirea</title>
    <meta charset="UTF-8" />
    <base href="/" />
    <style>
      html.startup-transitions-blocked *,
      html.startup-transitions-blocked *::before,
      html.startup-transitions-blocked *::after {
        transition: none !important;
      }

      .startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #3b6945;
        opacity: 1;
        transition: opacity 150ms ease;
      }

      .startup-overlay.is-hidden {
        opacity: 0;
      }
    </style>
    <style>
      :root {
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-reading: Georgia, "Times New Roman", serif;
        --reading-font-size: 18px;
        --gap: 8px;
        --bg: #f6f8f3;
        --surface: #ffffff;
        --surface-hover: #ecf2e8;
        --personal-psalm-bg: #fceef3;
        --personal-psalm-border: #e7c7d4;
        --text: #28332b;
        --text-muted: #58675d;
        --border: #d3ded0;
        --primary: #3b6945;
        --primary-hover: #2b5134;
        --on-primary: #ffffff;
        --accent: #a23866;
        --error: #b42318;
        --focus: #3b6945;
        --highlight-bg: #f8e9a1;
        --highlight-text: #28332b;
        --scrollbar-thumb: var(--text-muted);
        color-scheme: light;
        scrollbar-color: var(--scrollbar-thumb) var(--surface);
      }
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }
      * {
        scrollbar-width: thin;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        font-weight: 400;
        line-height: 1.5;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="styles.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="styles.css" /></noscript>
  </head>
  <body>
    <div class="startup-overlay" aria-hidden="true"></div>
    <app-root>Loading...</app-root>
    <script>
      const overlay = document.querySelector(".startup-overlay");
      const color = localStorage.getItem("psalter.themeColor");
      if (overlay && color && /^#[0-9a-f]{6}$/i.test(color)) {
        overlay.style.backgroundColor = color;
      }
      window.setTimeout(() => {
        document.documentElement.classList.remove(
          "startup-transitions-blocked",
        );
        overlay?.classList.add("is-hidden");
      }, 100);
      window.setTimeout(() => overlay?.remove(), 200);
    </script>
    <script src="main.js" type="module"></script>
  </body>
</html>
